name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-api
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend-api/package-lock.json

      # 네이티브 모듈(odbc, oracledb 등) 빌드를 건너뛰고 설치
      - run: npm ci --legacy-peer-deps --ignore-scripts

      # SQLite 기반 단위 테스트에 필요한 네이티브 바인딩만 설치
      - name: Prepare SQLite test driver
        run: npm rebuild sqlite3

      - name: Validate native compiler and classic tool API separation
        run: npm run test:toolchain

      - name: Lint
        run: npx eslint src --ext .ts

      - name: Build
        run: npm run build

      - name: Unit tests
        # src 전체 회귀. native DuckDB 테스트를 두 worker로 분리하고 PostgreSQL 검증은 아래 별도 job에서 수행한다.
        run: npm test -- --maxWorkers=2

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend-api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend-api/package-lock.json
      - run: npm ci --legacy-peer-deps --ignore-scripts
      - run: npm rebuild sqlite3
      - run: npm run build
      - name: PostgreSQL bootstrap and lock contract
        run: npm test -- --runInBand migrate-prod.postgres.spec.ts
        env:
          VM_MIGRATE_PROD_POSTGRES_HOST: 127.0.0.1
          VM_MIGRATE_PROD_POSTGRES_PORT: 5432
          VM_MIGRATE_PROD_POSTGRES_USER: postgres
          VM_MIGRATE_PROD_POSTGRES_PASSWORD: postgres
          VM_MIGRATE_PROD_POSTGRES_DB: postgres

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend-web/package-lock.json
            landing-page/package-lock.json

      - run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint src e2e --ext .ts,.tsx

      - name: Unit tests
        run: npx vitest run --maxWorkers=2

      - name: Build
        run: |
          cp .env.example .env
          npm run build
        env:
          CI: false

      # Landing imports the shared frontend components, so validate it after both
      # package installations in this job rather than leaving its dependency PRs unchecked.
      - name: Install landing dependencies
        run: npm --prefix ../landing-page ci --legacy-peer-deps

      - name: Validate landing
        working-directory: landing-page
        run: |
          npm run typecheck
          npm run build
