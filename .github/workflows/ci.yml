name: CI

on:
  push:
    branches: [main, develop, develop-v2]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend-api/package-lock.json

      # 네이티브 모듈(odbc, oracledb 등) 빌드를 건너뛰고 설치
      - run: npm ci --legacy-peer-deps --ignore-scripts

      - name: Lint
        run: npx eslint src --ext .ts

      - name: Build
        run: npm run build

      - name: Unit tests
        # TODO: 나머지 spec suite는 DI mock이 없는 스캐폴딩 상태 — 정비 후 전체 jest로 전환
        run: npm test -- --runInBand

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-web/package-lock.json

      - run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint src e2e --ext .ts,.tsx

      - name: Unit tests
        run: npx vitest run

      - name: Build
        run: |
          cp .env.example .env
          npm run build
        env:
          CI: false
