services:
  frontend:
    build:
      dockerfile: Dockerfile.prod
      args:
        REACT_APP_API_URL: ${MCP_PUBLIC_API_URL:-http://localhost:4000/v1}
        REACT_APP_MODE: local
    environment:
      API_UPSTREAM: backend:4000
    ports: !override ["127.0.0.1:3000:80"]
  backend:
    build:
      dockerfile: Dockerfile.prod
    ports: !override ["127.0.0.1:4000:4000"]
    environment:
      MCP_OAUTH_CLIENTS_JSON: '[{"id":"claude-code","name":"Claude Code","redirectUris":["http://localhost:53683/callback","http://127.0.0.1:53683/callback"],"scopes":["artifacts:read","artifacts:write"]},{"id":"codex","name":"Codex","redirectUris":["http://localhost:53684/callback","http://127.0.0.1:53684/callback","http://127.0.0.1:53684/callback/6m2PpwaEkjMj"],"scopes":["artifacts:read","artifacts:write"]}]'
  postgres:
    ports: !override []
