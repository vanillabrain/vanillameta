# Single-VM production stack for the invite beta. Run from this directory:
#   cp .env.prod.example .env.prod   # fill every value
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d
# Topology: client -> caddy (TLS) -> web (nginx) -> api -> postgres. Only caddy publishes ports.
# The API sees two proxies in front of it, hence TRUST_PROXY_HOPS=2. Single instance only: several
# in-memory states (publication tickets, run idempotency) are not shared across processes.

name: vanillameta

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-api-env: &api-env
  NODE_ENV: prod
  TRUST_PROXY_HOPS: "2"
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: ${POSTGRES_DB:-vanillameta}
  DB_USERNAME: ${POSTGRES_USER:-vanillameta}
  DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
  DB_CONNECTION_LIMIT: ${DB_CONNECTION_LIMIT:-10}
  ACCESS_SECRET: ${ACCESS_SECRET:?set ACCESS_SECRET}
  REFRESH_SECRET: ${REFRESH_SECRET:?set REFRESH_SECRET}
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET}
  URL_ACCESS_SECRET: ${URL_ACCESS_SECRET:?set URL_ACCESS_SECRET}
  CONFIG_SECRET_KEY: ${CONFIG_SECRET_KEY:?set CONFIG_SECRET_KEY}
  CORS_ORIGIN: https://${APP_DOMAIN:?set APP_DOMAIN}
  ALLOWED_SOURCE_TYPES: ${ALLOWED_SOURCE_TYPES:-file,sample}
  SIGNUP_MODE: ${SIGNUP_MODE:-invite}
  QUOTA_DAILY_CALLS: ${QUOTA_DAILY_CALLS:-}
  QUOTA_MONTHLY_TOKENS: ${QUOTA_MONTHLY_TOKENS:-}
  PUBLICATION_DEFAULT_DAYS: ${PUBLICATION_DEFAULT_DAYS:-}
  USER_THROTTLE_AI_PER_MIN: ${USER_THROTTLE_AI_PER_MIN:-}
  USER_THROTTLE_UPLOAD_PER_MIN: ${USER_THROTTLE_UPLOAD_PER_MIN:-}
  USER_THROTTLE_READ_PER_MIN: ${USER_THROTTLE_READ_PER_MIN:-}
  USER_THROTTLE_REMIX_PER_MIN: ${USER_THROTTLE_REMIX_PER_MIN:-}
  UPLOAD_MAX_SOURCES_PER_USER: ${UPLOAD_MAX_SOURCES_PER_USER:-}
  UPLOAD_MAX_BYTES_PER_USER: ${UPLOAD_MAX_BYTES_PER_USER:-}

services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    logging: *logging
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
    networks: [edge, app]

  web:
    image: ${WEB_IMAGE:-ghcr.io/vanillabrain/vanillameta-web}:${IMAGE_TAG:?set IMAGE_TAG}
    restart: unless-stopped
    logging: *logging
    environment:
      API_UPSTREAM: api:4000
    depends_on:
      api:
        condition: service_healthy
    networks: [app]

  api:
    image: ${API_IMAGE:-ghcr.io/vanillabrain/vanillameta-api}:${IMAGE_TAG:?set IMAGE_TAG}
    restart: unless-stopped
    logging: *logging
    init: true
    stop_grace_period: 30s
    environment:
      <<: *api-env
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_API_BASE_URL: ${AI_API_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_REASONING_EFFORT: ${AI_REASONING_EFFORT:-}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-}
      AI_MAX_INPUT_TOKENS: ${AI_MAX_INPUT_TOKENS:-}
      GOVERNANCE_AI_ENABLED: ${GOVERNANCE_AI_ENABLED:-false}
      AI_GLOBAL_MONTHLY_TOKENS: ${AI_GLOBAL_MONTHLY_TOKENS:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      GOOGLE_DOCS_CLIENT_ID: ${GOOGLE_DOCS_CLIENT_ID:-}
      GOOGLE_DOCS_CLIENT_SECRET: ${GOOGLE_DOCS_CLIENT_SECRET:-}
      GOOGLE_DOCS_REDIRECT_URI: ${GOOGLE_DOCS_REDIRECT_URI:-}
      MCP_PUBLIC_API_URL: ${MCP_PUBLIC_API_URL:-}
      MCP_PUBLIC_WEB_URL: ${MCP_PUBLIC_WEB_URL:-}
      MCP_OAUTH_CLIENTS_JSON: ${MCP_OAUTH_CLIENTS_JSON:-}
    volumes:
      - uploads:/data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    mem_limit: 4g
    networks:
      app: {}
      egress: {}

  # One-off schema step. It exits non-zero (and api never starts) on a half-built or foreign schema.
  migrate:
    image: ${API_IMAGE:-ghcr.io/vanillabrain/vanillameta-api}:${IMAGE_TAG:?set IMAGE_TAG}
    restart: "no"
    logging: *logging
    init: true
    command: ["node", "dist/src/database/migrate-prod.js"]
    environment: *api-env
    depends_on:
      postgres:
        condition: service_healthy
    networks: [app]

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vanillameta}
      POSTGRES_USER: ${POSTGRES_USER:-vanillameta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    command:
      ["postgres", "-c", "max_connections=100", "-c", "shared_buffers=256MB"]
    mem_limit: 1200m
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -h 127.0.0.1',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [app]

volumes:
  postgres-data:
  uploads:
  caddy-data:
  caddy-config:

networks:
  # Front door: only caddy is on it. Not internal, caddy publishes the ports and must reach Let's Encrypt.
  edge:
    name: vanillameta-edge
  # Service-to-service traffic. `internal` cuts it off from the outside, so postgres, migrate and web
  # cannot open outbound connections.
  app:
    name: vanillameta-app
    internal: true
  # Outbound path for the api only (LLM provider). Fixed subnet so egress-guard.sh can filter it.
  egress:
    name: vanillameta-egress
    ipam:
      config:
        - subnet: 172.29.40.0/24
