# Rendered by the nginx image from /etc/nginx/templates; only ${API_UPSTREAM} is substituted
# (NGINX_ENVSUBST_FILTER keeps nginx's own $variables intact).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Uploads are capped by the API (FILE_UPLOAD_MAX_BYTES); this only needs to be at least as large.
  client_max_body_size 110m;
  server_tokens off;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }

  location /v1/ {
    proxy_pass http://${API_UPSTREAM};
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    # Streaming responses (NDJSON now, SSE with AI streaming) must not be held back by buffering.
    proxy_buffering off;
    proxy_read_timeout 300s;
    # The API already sets this (helmet); keep a single copy.
    proxy_hide_header X-Content-Type-Options;
    add_header X-Content-Type-Options "nosniff" always;
  }

  location /socket.io/ {
    proxy_pass http://${API_UPSTREAM};
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  # SPA fallback must retain these headers; do not redirect protected documents to an unprotected index location.
  location ^~ /organizations {
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri /index.html =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
    expires 7d;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }
}
