services:
  # ── 기본 스택: docker compose up ────────────────────────────────
  # PostgreSQL 17 메타데이터와 샘플 대시보드를 함께 준비한다.
  backend:
    build: ./backend-api
    environment:
      NODE_ENV: dev
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-vanillameta}
      DB_PASSWORD: ${DB_PASSWORD:-vanillameta}
      DB_NAME: ${DB_NAME:-vanillameta}
      FILE_UPLOAD_DIR: /data/uploads
      # 데모용 기본값 — 프로덕션에서는 반드시 환경변수로 재정의할 것
      ACCESS_SECRET: ${ACCESS_SECRET:-dev-only-access-secret}
      REFRESH_SECRET: ${REFRESH_SECRET:-dev-only-refresh-secret}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-only-jwt-secret}
      URL_ACCESS_SECRET: ${URL_ACCESS_SECRET:-dev-only-url-secret}
      CONFIG_SECRET_KEY: ${CONFIG_SECRET_KEY:-dev-only-config-secret}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      # REDIS_URL: redis://redis:6379   # --profile cache 사용 시
    # 부팅 시 시드(멱등) 후 앱 기동
    command: sh -c "mkdir -p /data/uploads && node dist/src/database/run-seed.js && node dist/src/main.js"
    ports:
      - "4000:4000"
    volumes:
      - vanillameta-data:/data
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend-web
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:4000/v1}
    ports:
      - "3000:80"
    depends_on:
      - backend

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vanillameta
      POSTGRES_USER: vanillameta
      POSTGRES_PASSWORD: vanillameta
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U vanillameta -d vanillameta -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 20

  # 쿼리 결과 분산 캐시용 Redis (선택): docker compose --profile cache up redis
  redis:
    profiles: ["cache"]
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  vanillameta-data:
  postgres-data:
