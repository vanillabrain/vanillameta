AWSTemplateFormatVersion: '2010-09-09'
Description: 'VanillaMeta Backend API - Integrated CloudWatch Monitoring Dashboard'

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, prod, local]
    Description: 'Deployment environment'
  
  ServiceName:
    Type: String
    Default: vanillameta-backend-api
    Description: 'Service name for resource naming'
  
  DBInstanceIdentifier:
    Type: String
    Default: ''
    Description: 'RDS instance identifier (optional)'

Resources:
  # 통합 모니터링 대시보드
  IntegratedMonitoringDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub '${ServiceName}-${Environment}-integrated-monitoring'
      DashboardBody: !Sub |
        {
          "periodOverride": "inherit",
          "widgets": [
            {
              "type": "text",
              "x": 0,
              "y": 0,
              "width": 24,
              "height": 1,
              "properties": {
                "markdown": "# VanillaMeta Integrated Monitoring Dashboard - ${Environment}\n**Last updated**: Auto-refresh enabled | **Environment**: ${Environment} | **Region**: ${AWS::Region}"
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 1,
              "width": 8,
              "height": 6,
              "properties": {
                "metrics": [
                  ["AWS/Lambda", "Invocations", "FunctionName", "${ServiceName}-${Environment}-app", { "stat": "Sum", "label": "Total Invocations" }],
                  [".", "Errors", ".", ".", { "stat": "Sum", "label": "Errors", "color": "#d62728" }],
                  [".", "Throttles", ".", ".", { "stat": "Sum", "label": "Throttles", "color": "#ff7f0e" }]
                ],
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "title": "Lambda Function Overview",
                "period": 300,
                "yAxis": {
                  "left": { "min": 0 }
                },
                "annotations": {
                  "horizontal": [
                    {
                      "label": "Error threshold",
                      "value": 10,
                      "color": "#d62728"
                    }
                  ]
                }
              }
            },
            {
              "type": "metric",
              "x": 8,
              "y": 1,
              "width": 8,
              "height": 6,
              "properties": {
                "metrics": [
                  ["AWS/Lambda", "Duration", "FunctionName", "${ServiceName}-${Environment}-app", { "stat": "Average", "label": "Avg Duration" }],
                  ["...", { "stat": "Maximum", "label": "Max Duration" }],
                  ["...", { "stat": "Minimum", "label": "Min Duration" }]
                ],
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "title": "Lambda Execution Duration (ms)",
                "period": 300,
                "yAxis": {
                  "left": { "min": 0 }
                },
                "annotations": {
                  "horizontal": [
                    {
                      "label": "Timeout warning (25s)",
                      "value": 25000,
                      "color": "#ff7f0e"
                    },
                    {
                      "label": "Timeout limit (30s)",
                      "value": 30000,
                      "color": "#d62728"
                    }
                  ]
                }
              }
            },
            {
              "type": "metric",
              "x": 16,
              "y": 1,
              "width": 8,
              "height": 6,
              "properties": {
                "metrics": [
                  ["AWS/Lambda", "ConcurrentExecutions", "FunctionName", "${ServiceName}-${Environment}-app", { "stat": "Maximum" }],
                  [".", "ProvisionedConcurrentExecutions", ".", ".", { "stat": "Maximum" }]
                ],
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "title": "Lambda Concurrent Executions",
                "period": 300,
                "yAxis": {
                  "left": { "min": 0 }
                }
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 7,
              "width": 12,
              "height": 6,
              "properties": {
                "metrics": [
                  ["AWS/ApiGateway", "Count", "ApiName", "${ServiceName}-${Environment}", { "stat": "Sum", "label": "Total Requests" }],
                  [".", "4XXError", ".", ".", { "stat": "Sum", "label": "4XX Errors", "color": "#ff7f0e" }],
                  [".", "5XXError", ".", ".", { "stat": "Sum", "label": "5XX Errors", "color": "#d62728" }]
                ],
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "title": "API Gateway Request Metrics",
                "period": 300,
                "yAxis": {
                  "left": { "min": 0 }
                }
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 7,
              "width": 12,
              "height": 6,
              "properties": {
                "metrics": [
                  ["AWS/ApiGateway", "Latency", "ApiName", "${ServiceName}-${Environment}", { "stat": "Average", "label": "Avg Latency" }],
                  ["...", { "stat": "Maximum", "label": "Max Latency" }],
                  ["...", { "stat": "Minimum", "label": "Min Latency" }]
                ],
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "title": "API Gateway Latency (ms)",
                "period": 300,
                "yAxis": {
                  "left": { "min": 0 }
                }
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 13,
              "width": 8,
              "height": 6,
              "properties": {
                "metrics": [
                  ["AWS/RDS", "CPUUtilization", "DBInstanceIdentifier", "${DBInstanceIdentifier}", { "stat": "Average", "visible": "${DBInstanceIdentifier}" != "" }],
                  [".", "DatabaseConnections", ".", ".", { "stat": "Average", "visible": "${DBInstanceIdentifier}" != "" }],
                  [".", "FreeableMemory", ".", ".", { "stat": "Average", "visible": "${DBInstanceIdentifier}" != "" }]
                ],
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "title": "RDS Performance Metrics",
                "period": 300,
                "yAxis": {
                  "left": { "min": 0 },
                  "right": { "min": 0 }
                }
              }
            },
            {
              "type": "metric",
              "x": 8,
              "y": 13,
              "width": 8,
              "height": 6,
              "properties": {
                "metrics": [
                  ["AWS/RDS", "ReadLatency", "DBInstanceIdentifier", "${DBInstanceIdentifier}", { "stat": "Average", "visible": "${DBInstanceIdentifier}" != "" }],
                  [".", "WriteLatency", ".", ".", { "stat": "Average", "visible": "${DBInstanceIdentifier}" != "" }],
                  [".", "ReadIOPS", ".", ".", { "stat": "Average", "visible": "${DBInstanceIdentifier}" != "", "yAxis": "right" }],
                  [".", "WriteIOPS", ".", ".", { "stat": "Average", "visible": "${DBInstanceIdentifier}" != "", "yAxis": "right" }]
                ],
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "title": "RDS I/O Performance",
                "period": 300,
                "yAxis": {
                  "left": { "min": 0, "label": "Latency (ms)" },
                  "right": { "min": 0, "label": "IOPS" }
                }
              }
            },
            {
              "type": "metric",
              "x": 16,
              "y": 13,
              "width": 8,
              "height": 6,
              "properties": {
                "metrics": [
                  ["AWS/RDS", "BinLogDiskUsage", "DBInstanceIdentifier", "${DBInstanceIdentifier}", { "stat": "Average", "visible": "${DBInstanceIdentifier}" != "" }],
                  [".", "FreeStorageSpace", ".", ".", { "stat": "Average", "visible": "${DBInstanceIdentifier}" != "" }],
                  [".", "SwapUsage", ".", ".", { "stat": "Average", "visible": "${DBInstanceIdentifier}" != "" }]
                ],
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "title": "RDS Storage Metrics",
                "period": 300,
                "yAxis": {
                  "left": { "min": 0 }
                }
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 19,
              "width": 12,
              "height": 6,
              "properties": {
                "metrics": [
                  ["VanillaMeta/${Environment}", "ErrorCount", { "stat": "Sum" }],
                  [".", "Http5xxErrorCount", { "stat": "Sum" }],
                  [".", "SlowResponseCount", { "stat": "Sum" }],
                  ["VanillaMeta/${Environment}/Database", "SlowQueryCount", { "stat": "Sum" }]
                ],
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "title": "Custom Application Metrics",
                "period": 300,
                "yAxis": {
                  "left": { "min": 0 }
                }
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 19,
              "width": 12,
              "height": 6,
              "properties": {
                "metrics": [
                  ["VanillaMeta/${Environment}/Database", "ConnectionPoolSize", { "stat": "Average" }],
                  [".", "ConnectionPoolUtilization", { "stat": "Average" }],
                  [".", "ActiveConnections", { "stat": "Average" }],
                  [".", "IdleConnections", { "stat": "Average" }]
                ],
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "title": "Database Connection Pool Metrics",
                "period": 300,
                "yAxis": {
                  "left": { "min": 0 }
                }
              }
            },
            {
              "type": "log",
              "x": 0,
              "y": 25,
              "width": 24,
              "height": 6,
              "properties": {
                "query": "SOURCE '/aws/lambda/${ServiceName}-${Environment}-app'\n| fields @timestamp, level, message, metadata.correlationId, metadata.requestPath, metadata.statusCode, metadata.executionTime\n| filter level = \"ERROR\" or metadata.statusCode >= 500\n| sort @timestamp desc\n| limit 50",
                "region": "${AWS::Region}",
                "title": "Recent Errors and 5XX Responses",
                "view": "table"
              }
            },
            {
              "type": "log",
              "x": 0,
              "y": 31,
              "width": 12,
              "height": 6,
              "properties": {
                "query": "SOURCE '/aws/lambda/${ServiceName}-${Environment}-app'\n| fields metadata.requestPath, metadata.executionTime, metadata.statusCode\n| filter metadata.executionTime exists and metadata.executionTime > 5000\n| stats avg(metadata.executionTime) as avgTime, max(metadata.executionTime) as maxTime, count() as slowRequests by metadata.requestPath\n| sort avgTime desc\n| limit 20",
                "region": "${AWS::Region}",
                "title": "Slow API Endpoints (>5s)",
                "view": "table"
              }
            },
            {
              "type": "log",
              "x": 12,
              "y": 31,
              "width": 12,
              "height": 6,
              "properties": {
                "query": "SOURCE '/aws/lambda/${ServiceName}-${Environment}-app'\n| fields @timestamp, metadata.executionTime, metadata.databaseEngine, metadata.queryHash\n| filter message like /Slow query detected/ and metadata.severity = \"CRITICAL\"\n| sort @timestamp desc\n| limit 20",
                "region": "${AWS::Region}",
                "title": "Critical Slow Queries",
                "view": "table"
              }
            },
            {
              "type": "number",
              "x": 0,
              "y": 37,
              "width": 6,
              "height": 3,
              "properties": {
                "metrics": [
                  ["AWS/Lambda", "Invocations", "FunctionName", "${ServiceName}-${Environment}-app", { "stat": "Sum" }]
                ],
                "period": 2592000,
                "region": "${AWS::Region}",
                "title": "Total Invocations (30d)",
                "setPeriodToTimeRange": true
              }
            },
            {
              "type": "number",
              "x": 6,
              "y": 37,
              "width": 6,
              "height": 3,
              "properties": {
                "metrics": [
                  ["AWS/Lambda", "Errors", "FunctionName", "${ServiceName}-${Environment}-app", { "stat": "Sum" }],
                  [".", "Invocations", ".", ".", { "stat": "Sum", "visible": false }]
                ],
                "period": 2592000,
                "region": "${AWS::Region}",
                "title": "Error Rate (30d)",
                "setPeriodToTimeRange": true,
                "sparkline": true,
                "view": "singleValue"
              }
            },
            {
              "type": "number",
              "x": 12,
              "y": 37,
              "width": 6,
              "height": 3,
              "properties": {
                "metrics": [
                  ["AWS/Lambda", "Duration", "FunctionName", "${ServiceName}-${Environment}-app", { "stat": "Average" }]
                ],
                "period": 2592000,
                "region": "${AWS::Region}",
                "title": "Avg Duration (30d)",
                "setPeriodToTimeRange": true,
                "sparkline": true,
                "view": "singleValue"
              }
            },
            {
              "type": "number",
              "x": 18,
              "y": 37,
              "width": 6,
              "height": 3,
              "properties": {
                "metrics": [
                  ["AWS/ApiGateway", "Count", "ApiName", "${ServiceName}-${Environment}", { "stat": "Sum" }]
                ],
                "period": 2592000,
                "region": "${AWS::Region}",
                "title": "API Requests (30d)",
                "setPeriodToTimeRange": true,
                "sparkline": true,
                "view": "singleValue"
              }
            }
          ]
        }

  # 통합 알람 그룹
  IntegratedAlarmDashboard:
    Type: AWS::CloudWatch::CompositeAlarm
    Condition: IsProduction
    Properties:
      AlarmName: !Sub '${ServiceName}-${Environment}-system-health'
      AlarmDescription: 'Overall system health composite alarm'
      AlarmRule: !Sub |
        (ALARM("${ServiceName}-${Environment}-high-error-rate") OR 
         ALARM("${ServiceName}-${Environment}-lambda-errors") OR 
         ALARM("${ServiceName}-${Environment}-high-latency") OR 
         ALARM("${ServiceName}-${Environment}-api-gateway-5xx") OR 
         ALARM("${ServiceName}-${Environment}-critical-slow-queries"))
      ActionsEnabled: true
      AlarmActions:
        - !Ref IntegratedNotificationTopic

  # API Gateway 5XX 알람
  ApiGateway5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: IsProduction
    Properties:
      AlarmName: !Sub '${ServiceName}-${Environment}-api-gateway-5xx'
      AlarmDescription: 'High 5XX error rate on API Gateway'
      MetricName: 5XXError
      Namespace: AWS/ApiGateway
      Dimensions:
        - Name: ApiName
          Value: !Sub '${ServiceName}-${Environment}'
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 10
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref IntegratedNotificationTopic

  # RDS CPU 알람
  RDSHighCPUAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasRDSInstance
    Properties:
      AlarmName: !Sub '${ServiceName}-${Environment}-rds-high-cpu'
      AlarmDescription: 'RDS CPU utilization is too high'
      MetricName: CPUUtilization
      Namespace: AWS/RDS
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Ref DBInstanceIdentifier
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref IntegratedNotificationTopic

  # RDS 연결 수 알람
  RDSHighConnectionsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasRDSInstance
    Properties:
      AlarmName: !Sub '${ServiceName}-${Environment}-rds-high-connections'
      AlarmDescription: 'RDS connection count is too high'
      MetricName: DatabaseConnections
      Namespace: AWS/RDS
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Ref DBInstanceIdentifier
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 40  # Adjust based on your RDS instance class
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref IntegratedNotificationTopic

  # 통합 알림 토픽
  IntegratedNotificationTopic:
    Type: AWS::SNS::Topic
    Condition: IsProduction
    Properties:
      TopicName: !Sub '${ServiceName}-${Environment}-integrated-alerts'
      DisplayName: 'VanillaMeta Integrated System Alerts'

  # 대시보드 접근 정책
  DashboardAccessPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub '${ServiceName}-${Environment}-dashboard-access'
      Description: 'Policy for accessing VanillaMeta monitoring dashboards'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - cloudwatch:GetDashboard
              - cloudwatch:ListDashboards
              - cloudwatch:GetMetricData
              - cloudwatch:GetMetricStatistics
              - cloudwatch:ListMetrics
              - logs:GetLogEvents
              - logs:StartQuery
              - logs:StopQuery
              - logs:GetQueryResults
              - logs:DescribeLogGroups
              - logs:DescribeLogStreams
            Resource: '*'

Conditions:
  IsProduction:
    !Equals [!Ref Environment, 'prod']
  HasRDSInstance:
    !Not [!Equals [!Ref DBInstanceIdentifier, '']]

Outputs:
  IntegratedDashboardURL:
    Description: 'Integrated CloudWatch Dashboard URL'
    Value: !Sub 'https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=${ServiceName}-${Environment}-integrated-monitoring'

  IntegratedNotificationTopicArn:
    Description: 'SNS Topic ARN for integrated system alerts'
    Value: !Ref IntegratedNotificationTopic
    Condition: IsProduction
    Export:
      Name: !Sub '${ServiceName}-${Environment}-integrated-alerts-arn'

  DashboardAccessPolicyArn:
    Description: 'IAM Policy ARN for dashboard access'
    Value: !Ref DashboardAccessPolicy
    Export:
      Name: !Sub '${ServiceName}-${Environment}-dashboard-access-policy-arn'

  CompositeAlarmName:
    Description: 'Composite alarm name for overall system health'
    Value: !Ref IntegratedAlarmDashboard
    Condition: IsProduction
    Export:
      Name: !Sub '${ServiceName}-${Environment}-system-health-alarm'