service: vanillameta-backend-api

#frameworkVersion: '2'

plugins:
  - serverless-plugin-typescript
  - serverless-offline
  - serverless-domain-manager
  - serverless-latest-layer-version
  - serverless-plugin-warmup
provider:
  name: aws
  runtime: nodejs14.x
  lambdaHashingVersion: 20201221
  memorySize: 1024  # Lambda 메모리 512MB → 1024MB로 최적화 (T01_S04)
  timeout: 10
  layers:
    - arn:aws:lambda:${opt:region, self:provider.region}:${AWS::AccountId}:layer:VanillaMetaApiNodeLibs:latest
  stage: ${opt:stage, file(./config.serverless.yml):STAGE}
  region: ${opt:region, file(./config.serverless.yml):AWS_REGION}
  deploymentBucket: ${file(./config.serverless.yml):DEPLOYMENT_BUCKET}
  environment:
    STAGE: ${self:provider.stage}
    NODE_ENV: ${self:provider.stage}
    NODE_PATH: "./:/opt/node_modules"
    DB_HOST: ${self:custom.DB_CONFIG.${self:custom.STAGE}.DB_HOST}
    DB_PORT: ${self:custom.DB_CONFIG.${self:custom.STAGE}.DB_PORT}
    DB_USERNAME: ${self:custom.DB_CONFIG.${self:custom.STAGE}.DB_USERNAME}
    DB_PASSWORD: ${self:custom.DB_CONFIG.${self:custom.STAGE}.DB_PASSWORD}
    DB_NAME: ${self:custom.DB_CONFIG.${self:custom.STAGE}.DB_NAME}
    CORS_ORIGIN: ${file(./config.serverless.yml):CORS_ORIGIN}
    TZ: 'Asia/Seoul'
    LOG_LEVEL: ${self:custom.LOG_CONFIG.${self:custom.STAGE}.LOG_LEVEL}
  # CloudWatch Logs 설정
  logs:
    restApi:
      level: INFO
      dataTrace: false
      executionLogging: true
    # Lambda 함수 로그 설정
    frameworkLambda: true
  logRetentionInDays: ${self:custom.LOG_CONFIG.${self:custom.STAGE}.RETENTION_DAYS}
  apiGateway:
    binaryMediaTypes:
      - '*/*'


custom:
  # Lambda 웜업 설정 (T02_S04)
  warmup:
    default:
      enabled: 
        - prod  # 프로덕션 환경에서만 활성화
      events:
        - schedule: rate(5 minutes)  # 5분마다 웜업
      timeout: 20  # 웜업 함수 타임아웃
      prewarm: true  # 배포 후 즉시 웜업
      concurrency: 1  # 동시 실행 수
      verbose: false  # 상세 로그 비활성화
      name: ${self:service}-${self:provider.stage}-warmup-plugin
      role: WarmupRole
      tags:
        Project: VanillaMeta
        Environment: ${self:provider.stage}
        Purpose: LambdaWarmup
  STAGE: ${self:provider.stage}
  DB_CONFIG: ${file(./config.serverless.yml):DB_CONFIG}
  DOMAINS: ${file(./config.serverless.yml):DOMAINS}
  # CloudWatch 로그 설정 (환경별)
  LOG_CONFIG:
    dev:
      LOG_LEVEL: debug
      RETENTION_DAYS: 7  # 개발 환경: 7일 보존
    prod:
      LOG_LEVEL: warn
      RETENTION_DAYS: 30  # 운영 환경: 30일 보존
    local:
      LOG_LEVEL: debug
      RETENTION_DAYS: 3  # 로컬 환경: 3일 보존
  customDomain:
    domainName: ${self:custom.DOMAINS.${self:custom.STAGE}}
    basePath: 'v1'
    stage: ${self:custom.STAGE}
    createRoute53Record: true
  serverless-offline:
    httpPort: 4000
    host: '0.0.0.0'
  serverlessPluginTypescript:
    tsConfigFileLocation: './tsconfig.build.json'
  webpack:
    includeModules: true

package:
  include:
    - .env
    - .env.dev
    - .env.prod
    - src/templates/**
  exclude:
    - node_modules/**
    - .git/**
    - test/**
    - e2e/**
    - nodemon.json
    - README.md
#    - src/**cd


functions:
  app: # 람다함수 이름
    handler: src/serverless.handler
    warmup:
      default:
        enabled: true  # 이 함수에 웜업 적용
    events:
      - http:
          method: ANY
          path: /
          cors:
            origin: '*'
            headers: '*'
            allowCredentials: true
            maxAge: 86400
      - http:
          method: ANY
          path: '{proxy+}'
          cors:
            origin: '*'
            headers: '*'
            allowCredentials: true
            maxAge: 86400

resources:
  Resources:
    # Lambda 웜업 IAM 역할 (T02_S04)
    WarmupRole:
      Type: AWS::IAM::Role
      Properties:
        RoleName: ${self:service}-${self:provider.stage}-warmup-role
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service:
                  - lambda.amazonaws.com
              Action: 'sts:AssumeRole'
        ManagedPolicyArns:
          - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        Policies:
          - PolicyName: WarmupLambdaInvokePolicy
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - lambda:InvokeFunction
                  Resource: 
                    - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:service}-${self:provider.stage}-app"
        Tags:
          - Key: Project
            Value: VanillaMeta
          - Key: Environment
            Value: ${self:provider.stage}
          - Key: Purpose
            Value: LambdaWarmup

    # CloudWatch Log Group (환경별 분리)
    AppLogGroup:
      Type: AWS::Logs::LogGroup
      Properties:
        LogGroupName: /aws/lambda/${self:service}-${self:provider.stage}-app
        RetentionInDays: ${self:custom.LOG_CONFIG.${self:custom.STAGE}.RETENTION_DAYS}
        Tags:
          - Key: Environment
            Value: ${self:provider.stage}
          - Key: Service
            Value: ${self:service}

    # 에러 로그 메트릭 필터
    ErrorMetricFilter:
      Type: AWS::Logs::MetricFilter
      Properties:
        LogGroupName: !Ref AppLogGroup
        FilterPattern: '{ $.level = "ERROR" }'
        MetricTransformations:
          - MetricNamespace: "VanillaMeta/${self:provider.stage}"
            MetricName: "ErrorCount"
            MetricValue: "1"
            DefaultValue: 0

    # HTTP 5xx 에러 메트릭 필터
    Http5xxMetricFilter:
      Type: AWS::Logs::MetricFilter
      Properties:
        LogGroupName: !Ref AppLogGroup
        FilterPattern: '{ $.metadata.statusCode >= 500 }'
        MetricTransformations:
          - MetricNamespace: "VanillaMeta/${self:provider.stage}"
            MetricName: "Http5xxErrorCount"
            MetricValue: "1"
            DefaultValue: 0

    # 응답 시간 메트릭 필터 (2초 이상)
    SlowResponseMetricFilter:
      Type: AWS::Logs::MetricFilter
      Properties:
        LogGroupName: !Ref AppLogGroup
        FilterPattern: '{ $.metadata.executionTime > 2000 }'
        MetricTransformations:
          - MetricNamespace: "VanillaMeta/${self:provider.stage}"
            MetricName: "SlowResponseCount"
            MetricValue: "1"
            DefaultValue: 0

    # 메모리 사용량 메트릭 필터 (90% 이상 사용)
    HighMemoryUsageMetricFilter:
      Type: AWS::Logs::MetricFilter
      Properties:
        LogGroupName: !Ref AppLogGroup
        FilterPattern: '[timestamp, requestId, level, message="Max Memory Used:", memory_used, ...]'
        MetricTransformations:
          - MetricNamespace: "VanillaMeta/${self:provider.stage}"
            MetricName: "MemoryUsage"
            MetricValue: "$memory_used"
            DefaultValue: 0

    # 콜드 스타트 메트릭 필터
    ColdStartMetricFilter:
      Type: AWS::Logs::MetricFilter
      Properties:
        LogGroupName: !Ref AppLogGroup
        FilterPattern: '[timestamp, requestId, level="INFO", message="INIT_START*", ...]'
        MetricTransformations:
          - MetricNamespace: "VanillaMeta/${self:provider.stage}"
            MetricName: "ColdStartCount"
            MetricValue: "1"
            DefaultValue: 0

    # 초기화 지속 시간 메트릭 필터
    InitDurationMetricFilter:
      Type: AWS::Logs::MetricFilter
      Properties:
        LogGroupName: !Ref AppLogGroup
        FilterPattern: '[timestamp, requestId, level, message="REPORT*", ..., duration_label="Init Duration:", init_duration, duration_unit, ...]'
        MetricTransformations:
          - MetricNamespace: "VanillaMeta/${self:provider.stage}"
            MetricName: "InitDuration"
            MetricValue: "$init_duration"
            DefaultValue: 0

    # 웜업 요청 메트릭 필터 (T02_S04)
    WarmupRequestMetricFilter:
      Type: AWS::Logs::MetricFilter
      Properties:
        LogGroupName: !Ref AppLogGroup
        FilterPattern: '{ $.message = "WarmUp - Lambda 함수 웜업 요청 처리됨" }'
        MetricTransformations:
          - MetricNamespace: "VanillaMeta/${self:provider.stage}"
            MetricName: "WarmupRequestCount"
            MetricValue: "1"
            DefaultValue: 0

    # 웜 스타트 감지 메트릭 필터 (웜업 후 실제 요청)
    WarmStartMetricFilter:
      Type: AWS::Logs::MetricFilter
      Properties:
        LogGroupName: !Ref AppLogGroup
        FilterPattern: '{ $.isWarmStart = true }'
        MetricTransformations:
          - MetricNamespace: "VanillaMeta/${self:provider.stage}"
            MetricName: "WarmStartCount"
            MetricValue: "1"
            DefaultValue: 0

    # CloudWatch 알람 (운영 환경에서만)
    ErrorAlarm:
      Type: AWS::CloudWatch::Alarm
      Condition: IsProduction
      Properties:
        AlarmName: "${self:service}-${self:provider.stage}-error-alarm"
        AlarmDescription: "High error rate detected"
        MetricName: "ErrorCount"
        Namespace: "VanillaMeta/${self:provider.stage}"
        Statistic: Sum
        Period: 300  # 5분
        EvaluationPeriods: 2
        Threshold: 10
        ComparisonOperator: GreaterThanThreshold
        TreatMissingData: notBreaching

    # 높은 메모리 사용량 알람
    HighMemoryAlarm:
      Type: AWS::CloudWatch::Alarm
      Condition: IsProduction
      Properties:
        AlarmName: "${self:service}-${self:provider.stage}-high-memory-alarm"
        AlarmDescription: "High memory usage detected (>90%)"
        MetricName: "MemoryUsage"
        Namespace: "VanillaMeta/${self:provider.stage}"
        Statistic: Average
        Period: 300  # 5분
        EvaluationPeriods: 2
        Threshold: 920  # 1024MB의 90%
        ComparisonOperator: GreaterThanThreshold
        TreatMissingData: notBreaching

    # 빈번한 콜드 스타트 알람
    FrequentColdStartAlarm:
      Type: AWS::CloudWatch::Alarm
      Condition: IsProduction
      Properties:
        AlarmName: "${self:service}-${self:provider.stage}-frequent-coldstart-alarm"
        AlarmDescription: "Frequent cold starts detected"
        MetricName: "ColdStartCount"
        Namespace: "VanillaMeta/${self:provider.stage}"
        Statistic: Sum
        Period: 900  # 15분
        EvaluationPeriods: 1
        Threshold: 10
        ComparisonOperator: GreaterThanThreshold
        TreatMissingData: notBreaching

    # 웜업 실패 알람 (T02_S04)
    WarmupFailureAlarm:
      Type: AWS::CloudWatch::Alarm
      Condition: IsProduction
      Properties:
        AlarmName: "${self:service}-${self:provider.stage}-warmup-failure-alarm"
        AlarmDescription: "Lambda warmup requests are failing"
        MetricName: "WarmupRequestCount"
        Namespace: "VanillaMeta/${self:provider.stage}"
        Statistic: Sum
        Period: 600  # 10분
        EvaluationPeriods: 2
        Threshold: 1
        ComparisonOperator: LessThanThreshold
        TreatMissingData: breaching  # 웜업 요청이 없으면 실패로 간주

  Conditions:
    IsProduction:
      Fn::Equals:
        - ${self:provider.stage}
        - prod

  Outputs:
    LogGroupName:
      Description: "CloudWatch Log Group Name"
      Value: !Ref AppLogGroup
      Export:
        Name: "${self:service}-${self:provider.stage}-log-group"

    LogGroupArn:
      Description: "CloudWatch Log Group ARN"
      Value: !GetAtt AppLogGroup.Arn
      Export:
        Name: "${self:service}-${self:provider.stage}-log-group-arn"
