version: '3.8'

services:
  # Redis 서비스
  redis:
    image: redis:7-alpine
    container_name: vanillameta_redis
    ports:
      - "6379:6379"
    networks:
      - vanillameta
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # MySQL 데이터베이스
  mysql:
    image: mysql:8.0
    container_name: vanillameta_mysql
    ports:
      - "3306:3306"
    networks:
      - vanillameta
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-vanillameta}
      MYSQL_USER: ${DB_USERNAME:-vanillameta}
      MYSQL_PASSWORD: ${DB_PASSWORD:-vanillameta123}
      TZ: Asia/Seoul
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/conf.d:/etc/mysql/conf.d
      - ./mysql-init-files:/docker-entrypoint-initdb.d:ro
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
      --max_connections=1000
      --max_allowed_packet=64M
      --innodb_buffer_pool_size=256M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # NestJS API 서버
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vanillameta_api
    ports:
      - "3000:3000"
    networks:
      - vanillameta
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DB_TYPE: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: ${DB_USERNAME:-vanillameta}
      DB_PASSWORD: ${DB_PASSWORD:-vanillameta123}
      DB_NAME: ${DB_NAME:-vanillameta}
      DB_CONNECTION_LIMIT: ${DB_CONNECTION_LIMIT:-5}
      KNEX_POOL_MAX: ${KNEX_POOL_MAX:-3}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ACCESS_SECRET: ${ACCESS_SECRET:-default_access_secret}
      REFRESH_SECRET: ${REFRESH_SECRET:-default_refresh_secret}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-default_jwt_secret}
      URL_ACCESS_SECRET: ${URL_ACCESS_SECRET:-default_url_secret}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3001}
    volumes:
      - ./sqlite_data:/app/sqlite_data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  vanillameta:
    driver: bridge