version: '3.8'

services:
  # Redis 서비스 (테스트용)
  redis-test:
    image: redis:7-alpine
    container_name: vanillameta_redis_test
    ports:
      - '6380:6379'
    networks:
      - vanillameta_test
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  # PostgreSQL 데이터베이스 (테스트용)
  postgres-test:
    image: postgres:17-alpine
    container_name: vanillameta_postgres_test
    ports:
      - '5433:5432'
    networks:
      - vanillameta_test
    environment:
      POSTGRES_DB: vanillameta_test
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_pass
      TZ: Asia/Seoul
    command: ['postgres', '-c', 'max_connections=200']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -h 127.0.0.1']
      interval: 10s
      timeout: 5s
      retries: 5
    tmpfs:
      - /var/lib/postgresql/data

  # 테스트 러너
  test-runner:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: vanillameta_test_runner
    networks:
      - vanillameta_test
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    environment:
      NODE_ENV: test
      DB_TYPE: postgres
      DB_HOST: postgres-test
      DB_PORT: 5432
      DB_USERNAME: test_user
      DB_PASSWORD: test_pass
      DB_NAME: vanillameta_test
      REDIS_HOST: redis-test
      REDIS_PORT: 6379
      ACCESS_SECRET: test_access_secret
      REFRESH_SECRET: test_refresh_secret
      JWT_ACCESS_SECRET: test_jwt_secret
      URL_ACCESS_SECRET: test_url_secret
    volumes:
      - ./src:/app/src:ro
      - ./test:/app/test:ro
      - ./coverage:/app/coverage
      - /app/node_modules
    command: yarn test:cov

networks:
  vanillameta_test:
    driver: bridge
